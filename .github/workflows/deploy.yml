name: Deploy Portfolio Locally

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Files to Public Web Root
        run: |
          mkdir -p /home/atomic/public_html
          # Clear old files and copy fresh build (exclude .git or runner files if any)
          rm -rf /home/atomic/public_html/*
          cp -r * /home/atomic/public_html/
          echo "Portfolio successfully deployed to public_html!"
